<svg width="520" height="150" viewBox="0 0 520 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uglyGradient" x1="20" y1="20" x2="125" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="arrowGradient" x1="45" y1="35" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F9FF"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="130" height="130" rx="34"
          fill="url(#uglyGradient)"/>
  </g>

  <!-- Stylized U -->
  <path
    d="M42 40V78C42 99 55 112 75 112C95 112 108 99 108 78V40"
    stroke="white"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Payment arrow -->
  <path
    d="M62 70H99"
    stroke="url(#arrowGradient)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <path
    d="M86 56L101 70L86 84"
    stroke="url(#arrowGradient)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark -->
  <text x="165" y="94"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="800"
        letter-spacing="-2">
    <tspan fill="#111827">Ugly</tspan><tspan fill="#5865F2">Pay</tspan>
  </text>

  <!-- Small accent -->
  <circle cx="457" cy="78" r="5" fill="#00E5FF"/>
</svg>

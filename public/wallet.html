<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ওয়ালেট</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="who"><div class="avatar" id="avatarLetter">·</div><div><div class="name">ওয়ালেট</div><div class="sub" style="color:var(--ink-soft);">উত্তোলন পরিচালনা করুন</div></div></div>
  </div>

  <div class="balance-card"><div class="lbl">উপলব্ধ ব্যালেন্স</div><div class="amt">৳<span id="balanceVal">0.00</span></div></div>

  <section class="block">
    <h3 id="withdrawHeading"></h3>
    <div class="card-p">
      <div class="alert bad" id="errBox"></div>
      <div class="alert good" id="okBox"></div>
      <form id="payoutForm">
        <div class="field noicon"><label>উত্তোলনের পরিমাণ</label><input id="amount" type="number" step="0.01" placeholder="৳0.00" /></div>
        <div class="field noicon"><label>পেমেন্ট মেথড</label>
          <select id="method">
            <option value="bkash">bKash</option>
            <option value="nagad">Nagad</option>
            <option value="rocket">Rocket</option>
            <option value="upay">Upay</option>
          </select>
        </div>
        <div class="field noicon"><label id="minFeeLbl"></label>
          <div class="inputwrap"><span class="ic" id="icPhone"></span><input id="payoutNumber" placeholder="আপনার নম্বর" style="padding-left:42px;" /></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitPayout">উত্তোলনের অনুরোধ পাঠান</button>
      </form>
    </div>
  </section>

  <section class="block"><h3 id="historyHeading"></h3><div class="list-card" id="payoutList"><div class="empty">লোড হচ্ছে…</div></div></section>
</div>
<div id="navSlot"></div>
<script src="/js/app.js"></script>
<script src="/js/wallet.js"></script>
</body>
</html>
